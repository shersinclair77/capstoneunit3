# =============================================================================
# Create-users.yml
# GitHub Actions workflow — M365 User Provisioning
#
# Triggers:
#   - Manual (workflow_dispatch) with optional CSV path override
#   - On push to main when onboarding CSV changes
#
# Notification email: RenaeHarewood@Renah.onmicrosoft.com
# Audit log: uploaded as artifact → Actions tab → run → Artifacts
# =============================================================================

name: M365 User Provisioning

on:
  workflow_dispatch:
    inputs:
      csv_path:
        description: 'Path to onboarding CSV (relative to repo root)'
        required: false
        default: './onboarding/users-to-onboard.csv'

  push:
    branches: [main]
    paths:
      - 'onboarding/users-to-onboard.csv'

jobs:
  # ── Job 1: Run Pester test suite ─────────────────────────────────────────
  # Provisioning CANNOT start unless all 31 tests pass.
  test:
    name: Pester Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PowerShell modules
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Microsoft.Graph        -Scope CurrentUser -Force
          Install-Module Pester                 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run Pester test suite
        shell: pwsh
        run: |
          $result = Invoke-Pester `
            -Path './tests/M365Provisioning.Tests.ps1' `
            -Output Detailed `
            -PassThru
          $result | Export-JUnitReport -Path './test-results/results.xml'
          if ($result.FailedCount -gt 0) {
            Write-Error "$($result.FailedCount) test(s) failed. Provisioning blocked."
            exit 1
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-test-results-${{ github.run_id }}
          path: ./test-results/results.xml
          retention-days: 90

  # ── Job 2: Provision users (only runs if all tests pass) ─────────────────
  provision:
    name: Provision M365 Users
    runs-on: ubuntu-latest
    needs: test   # <-- quality gate: blocked until test job succeeds

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PowerShell modules
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Microsoft.Graph -Scope CurrentUser -Force

      - name: Run provisioning script
        shell: pwsh
        env:
          TENANT_ID:     ${{ secrets.M365_TENANT_ID }}
          CLIENT_ID:     ${{ secrets.M365_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.M365_CLIENT_SECRET }}
        run: |
          ./scripts/Create-M365Users.ps1 `
            -TenantId           $env:M365_TENANT_ID `
            -ClientId           $env:M365_CLIENT_ID `
            -ClientSecret       $env:M365_CLIENT_SECRET `
            -NotificationEmail  "RenaeHarewood@Renah.onmicrosoft.com" `
            -RunId              "${{ github.run_id }}" `
            -CommitSha          "${{ github.sha }}" `
            -CsvPath            "${{ github.event.inputs.csv_path || './onboarding/users-to-onboard.csv' }}"

      # ── Upload audit log as artifact ────────────────────────────────────
      # Accessible from: Actions tab → this run → Artifacts section (bottom of page)
      # Retained for 90 days. Link in the summary email points here.
      - name: Upload audit log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provisioning-audit-log-${{ github.run_id }}
          path: ./audit-logs/
          retention-days: 90
