# =============================================================================
# .github/workflows/Test-MfaDiagnostic.yml
#
# PURPOSE: Diagnoses exactly why MFA enforcement is not working.
#          Runs 8 checks and prints the raw API response at every step.
#
# HOW TO RUN:
#   GitHub repo > Actions tab > "MFA Diagnostic" > Run workflow
#   Enter the UPN of any existing user to test against.
#
# REQUIRED SECRETS (same as provisioning workflow):
#   TENANT_ID, CLIENT_ID, CLIENT_SECRET
# =============================================================================
 
name: MFA Diagnostic
 
on:
  workflow_dispatch:
    inputs:
      test_user_upn:
        description: 'UPN of an existing user to test MFA against'
        required: true
        default: 'alice.johnson@renah.onmicrosoft.com'
 
jobs:
  diagnose:
    name: Run MFA Diagnostic
    runs-on: ubuntu-latest
 
    steps:
      - name: Install Microsoft.Graph module
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Microsoft.Graph -Scope CurrentUser -Force
 
      # ── Pre-check: verify secrets are populated ──────────────────────────────
      - name: Verify secrets are set
        shell: pwsh
        env:
          TENANT_ID:     ${{ secrets.TENANT_ID }}
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:TENANT_ID))     { $missing += "TENANT_ID" }
          if ([string]::IsNullOrWhiteSpace($env:CLIENT_ID))     { $missing += "CLIENT_ID" }
          if ([string]::IsNullOrWhiteSpace($env:CLIENT_SECRET)) { $missing += "CLIENT_SECRET" }
 
          if ($missing.Count -gt 0) {
            Write-Host ""
            Write-Host "  ╔════════════════════════════════════════════════════════════╗" -ForegroundColor Red
            Write-Host "  ║  MISSING GITHUB SECRETS — cannot connect to Graph         ║" -ForegroundColor Red
            Write-Host "  ║                                                            ║" -ForegroundColor Red
            foreach ($s in $missing) {
              Write-Host "  ║  Missing: $($s.PadRight(50)) ║" -ForegroundColor Red
            }
            Write-Host "  ║                                                            ║" -ForegroundColor Red
            Write-Host "  ║  Fix: GitHub repo > Settings > Secrets and variables >    ║" -ForegroundColor Red
            Write-Host "  ║       Actions > New repository secret                     ║" -ForegroundColor Red
            Write-Host "  ║                                                            ║" -ForegroundColor Red
            Write-Host "  ║  Required secret names (case-sensitive):                  ║" -ForegroundColor Red
            Write-Host "  ║    TENANT_ID      — Azure AD tenant ID (GUID)             ║" -ForegroundColor Red
            Write-Host "  ║    CLIENT_ID      — App Registration client ID (GUID)     ║" -ForegroundColor Red
            Write-Host "  ║    CLIENT_SECRET  — App Registration client secret value  ║" -ForegroundColor Red
            Write-Host "  ╚════════════════════════════════════════════════════════════╝" -ForegroundColor Red
            exit 1
          }
 
          # Show length only (never reveal the actual value)
          Write-Host "  [PASS] TENANT_ID     is set ($($env:TENANT_ID.Length) chars)" -ForegroundColor Green
          Write-Host "  [PASS] CLIENT_ID     is set ($($env:CLIENT_ID.Length) chars)" -ForegroundColor Green
          Write-Host "  [PASS] CLIENT_SECRET is set ($($env:CLIENT_SECRET.Length) chars)" -ForegroundColor Green
          Write-Host "  [INFO] Test UPN : ${{ github.event.inputs.test_user_upn }}" -ForegroundColor Cyan
 
      - name: Run MFA diagnostic
        shell: pwsh
        env:
          TENANT_ID:     ${{ secrets.TENANT_ID }}
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          TEST_UPN:      ${{ github.event.inputs.test_user_upn }}
        run: |
 
          function Write-Step { param([string]$n,[string]$m)
            Write-Host ""
            Write-Host ("="*70) -ForegroundColor DarkGray
            Write-Host "  STEP $n : $m" -ForegroundColor White
            Write-Host ("="*70) -ForegroundColor DarkGray
          }
          function Write-OK   { param([string]$m) Write-Host "  [PASS] $m" -ForegroundColor Green  }
          function Write-FAIL { param([string]$m) Write-Host "  [FAIL] $m" -ForegroundColor Red    }
          function Write-INFO { param([string]$m) Write-Host "  [INFO] $m" -ForegroundColor Cyan   }
          function Write-WARN { param([string]$m) Write-Host "  [WARN] $m" -ForegroundColor Yellow }
 
          # ── Connect ──────────────────────────────────────────────────────────
          Write-Step "0" "Connect to Microsoft Graph"
 
          # Validate each secret individually for a clear error message
          $secrets = @{
            TENANT_ID     = $env:TENANT_ID
            CLIENT_ID     = $env:CLIENT_ID
            CLIENT_SECRET = $env:CLIENT_SECRET
          }
          foreach ($kv in $secrets.GetEnumerator()) {
            if ([string]::IsNullOrWhiteSpace($kv.Value)) {
              Write-FAIL "$($kv.Key) secret is empty — add it in repo Settings > Secrets and variables > Actions"
              exit 1
            }
          }
 
          try {
            $sec  = ConvertTo-SecureString $env:CLIENT_SECRET -AsPlainText -Force
            $cred = New-Object System.Management.Automation.PSCredential($env:CLIENT_ID, $sec)
            Connect-MgGraph -TenantId $env:TENANT_ID -ClientSecretCredential $cred -NoWelcome
            Write-OK "Connected successfully."
          } catch {
            Write-FAIL "Connection failed: $_"
            Write-FAIL ""
            Write-FAIL "Common causes:"
            Write-FAIL "  - TENANT_ID is wrong (should be the directory/tenant GUID, not a domain name)"
            Write-FAIL "  - CLIENT_ID is wrong (should be the application/client GUID)"
            Write-FAIL "  - CLIENT_SECRET has expired — create a new one in Entra > App registrations"
            Write-FAIL "  - CLIENT_SECRET value was copied with a leading/trailing space"
            exit 1
          }
 
          # ── Step 1: Security Defaults ─────────────────────────────────────────
          Write-Step "1" "Security Defaults — must be DISABLED for per-user MFA to work"
          try {
            $sd = Invoke-MgGraphRequest -Method GET `
                    -Uri "https://graph.microsoft.com/v1.0/policies/identitySecurityDefaultsEnforcementPolicy"
            Write-INFO "isEnabled = $($sd.isEnabled)"
            if ($sd.isEnabled) {
              Write-FAIL "Security Defaults is ENABLED."
              Write-FAIL "This is why MFA stays disabled — all per-user MFA writes are silently discarded."
              Write-FAIL "FIX: Entra admin center > Properties > Manage security defaults > Off"
            } else {
              Write-OK "Security Defaults is DISABLED — per-user MFA writes should be allowed."
            }
          } catch {
            Write-WARN "Could not read Security Defaults: $($_.Exception.Message)"
            Write-WARN "Add Policy.Read.All (Application) permission and re-run."
          }
 
          # ── Step 2: Token permissions ─────────────────────────────────────────
          Write-Step "2" "Token permissions — which permissions did the App Registration actually receive?"
          try {
            $ctx = Get-MgContext
            Write-INFO "AuthType : $($ctx.AuthType)"
            Write-INFO "TenantId : $($ctx.TenantId)"
            Write-INFO "Scopes granted:"
            $ctx.Scopes | Sort-Object | ForEach-Object { Write-INFO "  $_" }
 
            $required = @(
              "Policy.ReadWrite.AuthenticationMethod",
              "UserAuthenticationMethod.ReadWrite.All",
              "Policy.Read.All",
              "User.ReadWrite.All"
            )
            Write-Host ""
            Write-INFO "Required permission check:"
            foreach ($p in $required) {
              if ($ctx.Scopes -contains $p) {
                Write-OK "$p — GRANTED"
              } else {
                Write-FAIL "$p — MISSING  <-- add this in App Registration + grant admin consent"
              }
            }
          } catch {
            Write-WARN "Could not read token context: $_"
          }
 
          # ── Step 3: Resolve user ───────────────────────────────────────────────
          Write-Step "3" "Resolve user: $env:TEST_UPN"
          $User = $null
          try {
            $User = Get-MgUser `
              -Filter "userPrincipalName eq '$env:TEST_UPN'" `
              -Property "Id,DisplayName,UserPrincipalName,AccountEnabled" `
              -ErrorAction Stop
            Write-OK "User found."
            Write-INFO "Id            : $($User.Id)"
            Write-INFO "DisplayName   : $($User.DisplayName)"
            Write-INFO "AccountEnabled: $($User.AccountEnabled)"
          } catch {
            Write-FAIL "User not found: $_"
            Disconnect-MgGraph | Out-Null
            exit 1
          }
 
          $UserId  = $User.Id
          $BetaUri = "https://graph.microsoft.com/beta/users/$UserId"
          $ReqUri  = "https://graph.microsoft.com/v1.0/users/$UserId/authentication/requirements"
          $TapUri  = "https://graph.microsoft.com/v1.0/users/$UserId/authentication/temporaryAccessPassMethods"
 
          # ── Step 4: Read current MFA state ─────────────────────────────────────
          Write-Step "4" "Read CURRENT MFA state before any changes"
          try {
            $before      = Invoke-MgGraphRequest -Method GET `
                             -Uri "$BetaUri`?`$select=strongAuthenticationRequirements"
            $beforeState = ($before.strongAuthenticationRequirements | Select-Object -First 1).state
            Write-INFO "Raw strongAuthenticationRequirements: $($before.strongAuthenticationRequirements | ConvertTo-Json -Compress)"
            Write-INFO "Current state: '$beforeState'"
            if (-not $beforeState) { Write-INFO "Array is empty — MFA never configured for this user." }
          } catch {
            Write-FAIL "Could not read beta user: $($_.Exception.Message)"
          }
          try {
            $v1 = Invoke-MgGraphRequest -Method GET -Uri $ReqUri
            Write-INFO "v1.0 perUserMfaState: '$($v1.perUserMfaState)'"
          } catch {
            Write-WARN "Could not read v1.0 requirements: $($_.Exception.Message)"
          }
 
          # ── Step 5: Attempt PATCH ──────────────────────────────────────────────
          Write-Step "5" "PATCH strongAuthenticationRequirements = Enforced"
          $patchBody = @{
            strongAuthenticationRequirements = @(
              @{
                state                          = "Enforced"
                rememberDevicesNotIssuedBefore = (Get-Date).ToUniversalTime().ToString("o")
              }
            )
          }
          $patchJson = $patchBody | ConvertTo-Json -Depth 5
          Write-INFO "Request body being sent:"
          Write-INFO $patchJson
 
          try {
            Invoke-MgGraphRequest `
              -Method PATCH `
              -Uri $BetaUri `
              -ContentType "application/json" `
              -Body $patchJson
            Write-OK "PATCH completed without throwing an exception."
          } catch {
            Write-FAIL "PATCH threw an exception:"
            Write-FAIL "  Message   : $($_.Exception.Message)"
            try {
              $errBody = $_.ErrorDetails.Message | ConvertFrom-Json
              Write-FAIL "  Error code: $($errBody.error.code)"
              Write-FAIL "  Error msg : $($errBody.error.message)"
            } catch { }
          }
 
          # ── Step 6: Read back after PATCH ─────────────────────────────────────
          Write-Step "6" "Read MFA state AFTER PATCH (5 s delay)"
          Start-Sleep -Seconds 5
          try {
            $after      = Invoke-MgGraphRequest -Method GET `
                            -Uri "$BetaUri`?`$select=strongAuthenticationRequirements"
            $afterState = ($after.strongAuthenticationRequirements | Select-Object -First 1).state
            Write-INFO "Raw strongAuthenticationRequirements after PATCH: $($after.strongAuthenticationRequirements | ConvertTo-Json -Compress)"
            Write-INFO "State after PATCH: '$afterState'"
 
            if ($afterState -eq "Enforced") {
              Write-OK "SUCCESS — state is Enforced. MFA enforcement is working."
            } elseif ($afterState -eq "Enabled") {
              Write-FAIL "State is ENABLED not Enforced."
              Write-FAIL "PATCH was accepted but tenant is downgrading Enforced to Enabled."
              Write-FAIL "Likely cause: Conditional Access policy is managing MFA for this tenant."
            } elseif (-not $afterState) {
              Write-FAIL "State is still empty — PATCH was accepted but had no effect."
              Write-FAIL "Most likely causes:"
              Write-FAIL "  1. Security Defaults is still active (re-check in portal)"
              Write-FAIL "  2. Policy.ReadWrite.AuthenticationMethod permission is missing or not consented"
              Write-FAIL "  3. Conditional Access is managing MFA — per-user API writes are blocked"
            } else {
              Write-FAIL "Unexpected state: '$afterState'"
            }
          } catch {
            Write-FAIL "Could not read state after PATCH: $($_.Exception.Message)"
          }
 
          # ── Step 7: v1.0 PATCH ────────────────────────────────────────────────
          Write-Step "7" "PATCH v1.0 perUserMfaState = enforced"
          try {
            Invoke-MgGraphRequest `
              -Method PATCH `
              -Uri $ReqUri `
              -ContentType "application/json" `
              -Body (@{ perUserMfaState = "enforced" } | ConvertTo-Json)
            Start-Sleep -Seconds 3
            $v1after = Invoke-MgGraphRequest -Method GET -Uri $ReqUri
            Write-INFO "v1.0 perUserMfaState after PATCH: '$($v1after.perUserMfaState)'"
            if ($v1after.perUserMfaState -eq "enforced") {
              Write-OK "v1.0 perUserMfaState = enforced"
            } else {
              Write-FAIL "v1.0 perUserMfaState = '$($v1after.perUserMfaState)' (expected enforced)"
            }
          } catch {
            Write-FAIL "v1.0 PATCH failed: $($_.Exception.Message)"
            try {
              $errBody = $_.ErrorDetails.Message | ConvertFrom-Json
              Write-FAIL "  Code: $($errBody.error.code)"
              Write-FAIL "  Msg : $($errBody.error.message)"
            } catch { }
          }
 
          # ── Step 8: TAP test ──────────────────────────────────────────────────
          Write-Step "8" "Test Temporary Access Pass creation"
          try {
            $tap = Invoke-MgGraphRequest `
              -Method POST `
              -Uri $TapUri `
              -ContentType "application/json" `
              -Body (@{ isUsableOnce = $true; lifetimeInMinutes = 60 } | ConvertTo-Json -Depth 3)
            Write-OK "TAP created successfully."
            Write-INFO "TAP code  : $($tap.temporaryAccessPass)"
            Write-INFO "Start time: $($tap.startDateTime)"
          } catch {
            Write-FAIL "TAP creation failed: $($_.Exception.Message)"
            try {
              $errBody = $_.ErrorDetails.Message | ConvertFrom-Json
              Write-FAIL "  Code: $($errBody.error.code)"
              Write-FAIL "  Msg : $($errBody.error.message)"
            } catch { }
          }
 
          # ── Summary ───────────────────────────────────────────────────────────
          Write-Host ""
          Write-Host ("="*70) -ForegroundColor DarkGray
          Write-Host "  DIAGNOSTIC COMPLETE" -ForegroundColor White
          Write-Host "  Review the [PASS] / [FAIL] lines above to identify the issue." -ForegroundColor White
          Write-Host ("="*70) -ForegroundColor DarkGray
 
          Disconnect-MgGraph | Out-Null
