# =============================================================================
# .github/workflows/Remove-licenses-and-groups.yml
#
# Removes all licenses and group memberships from users listed in the
# onboarding CSV. Reads FirstName/LastName columns and builds UPNs
# automatically — no separate CSV needed.
#
# Does NOT: delete accounts, block sign-in, convert mailboxes, or modify MFA.
#
# Secrets required:
#   M365_TENANT_ID, M365_CLIENT_ID, M365_CLIENT_SECRET
# =============================================================================

name: Remove User Licenses and Groups

on:
  workflow_dispatch:
    inputs:
      csv_path:
        description: 'Path to onboarding CSV containing the users to clean up'
        required: false
        default: './onboarding/users-to-onboard.csv'

jobs:
  cleanup:
    name: Remove Licenses and Groups
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Microsoft.Graph module
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Microsoft.Graph -Scope CurrentUser -Force

      - name: Run cleanup script
        shell: pwsh
        env:
          M365_TENANT_ID:     ${{ secrets.M365_TENANT_ID }}
          M365_CLIENT_ID:     ${{ secrets.M365_CLIENT_ID }}
          M365_CLIENT_SECRET: ${{ secrets.M365_CLIENT_SECRET }}
        run: |
          ./scripts/Remove-UserLicensesAndGroups.ps1 `
            -TenantId          $env:M365_TENANT_ID `
            -ClientId          $env:M365_CLIENT_ID `
            -ClientSecret      $env:M365_CLIENT_SECRET `
            -NotificationEmail "RenaeHarewood@Renah.onmicrosoft.com" `
            -RunId             "${{ github.run_id }}" `
            -CommitSha         "${{ github.sha }}" `
            -CsvPath           "${{ github.event.inputs.csv_path || './onboarding/users-to-onboard.csv' }}"

      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cleanup-audit-log-${{ github.run_id }}
          path: ./audit-logs/
          retention-days: 90
