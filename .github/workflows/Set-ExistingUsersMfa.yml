# =============================================================================
# .github/workflows/Set-ExistingUsersMfa.yml
#
# PURPOSE: Sets perUserMfaState=enforced and issues a TAP for users who were
#          already created before the UserAuthenticationMethod.ReadWrite.All
#          permission was added. The provisioning script skips existing users,
#          so this workflow patches them directly.
#
# HOW TO RUN:
#   Actions tab > "Set MFA for Existing Users" > Run workflow
#   Enter a comma-separated list of UPNs to update.
#
# REQUIRED SECRETS: M365_TENANT_ID, M365_CLIENT_ID, M365_CLIENT_SECRET
# =============================================================================

name: Set MFA for Existing Users

on:
  workflow_dispatch:
    inputs:
      upns:
        description: 'Comma-separated UPNs to update (e.g. alice.johnson@renah.onmicrosoft.com,bob.smith@renah.onmicrosoft.com)'
        required: true
        default: 'alice.johnson@renah.onmicrosoft.com,bob.smith@renah.onmicrosoft.com,carol.white@renah.onmicrosoft.com'

jobs:
  set-mfa:
    name: Set MFA Enforced on Existing Users
    runs-on: ubuntu-latest

    steps:
      - name: Install Microsoft.Graph
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Microsoft.Graph -Scope CurrentUser -Force

      - name: Set MFA and issue TAP for each user
        shell: pwsh
        env:
          TENANT_ID:     ${{ secrets.M365_TENANT_ID }}
          CLIENT_ID:     ${{ secrets.M365_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.M365_CLIENT_SECRET }}
          UPNS:          ${{ github.event.inputs.upns }}
        run: |

          # ── Connect ──────────────────────────────────────────────────────────
          $sec  = ConvertTo-SecureString $env:CLIENT_SECRET -AsPlainText -Force
          $cred = New-Object System.Management.Automation.PSCredential($env:CLIENT_ID, $sec)
          Connect-MgGraph -TenantId $env:TENANT_ID -ClientSecretCredential $cred -NoWelcome
          Write-Host "Connected to Microsoft Graph." -ForegroundColor Green

          $upnList = $env:UPNS -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ -ne '' }
          Write-Host "Users to update: $($upnList -join ', ')" -ForegroundColor Cyan

          $Results = @()

          foreach ($UPN in $upnList) {
            Write-Host ""
            Write-Host ("─" * 60) -ForegroundColor DarkGray
            Write-Host "  Processing: $UPN" -ForegroundColor White
            Write-Host ("─" * 60) -ForegroundColor DarkGray

            # ── Resolve user ────────────────────────────────────────────────────
            $User = Get-MgUser `
              -Filter "userPrincipalName eq '$UPN'" `
              -Property "Id,DisplayName,AccountEnabled" `
              -ErrorAction SilentlyContinue

            if (-not $User) {
              Write-Warning "  User $UPN not found — skipping."
              $Results += [PSCustomObject]@{ UPN=$UPN; MfaState="User not found"; TAP="N/A"; Status="Skipped" }
              continue
            }

            Write-Host "  Found: $($User.DisplayName) (Id: $($User.Id))" -ForegroundColor Green

            $ReqUri = "https://graph.microsoft.com/v1.0/users/$($User.Id)/authentication/requirements"
            $TapUri = "https://graph.microsoft.com/v1.0/users/$($User.Id)/authentication/temporaryAccessPassMethods"
            $MfaOk  = $false
            $TapCode = $null

            # ── PATCH perUserMfaState = enforced ────────────────────────────────
            Write-Host "  Setting perUserMfaState = enforced..." -ForegroundColor Cyan
            try {
              Invoke-MgGraphRequest `
                -Method PATCH `
                -Uri $ReqUri `
                -ContentType "application/json" `
                -Body (@{ perUserMfaState = "enforced" } | ConvertTo-Json -Depth 3)

              Start-Sleep -Seconds 3
              $check = Invoke-MgGraphRequest -Method GET -Uri $ReqUri
              $state = $check.perUserMfaState

              Write-Host "  perUserMfaState after PATCH: '$state'" -ForegroundColor Cyan

              if ($state -eq "enforced") {
                Write-Host "  [OK] MFA state = enforced." -ForegroundColor Green
                $MfaOk = $true
              }
              else {
                # PATCH returned 200 but state is wrong — show full response for diagnosis
                Write-Warning "  PATCH returned 200 but state = '$state' (expected enforced)."
                Write-Warning "  Full GET response: $($check | ConvertTo-Json -Compress)"
              }
            }
            catch {
              $errMsg = $_.Exception.Message
              Write-Warning "  PATCH failed: $errMsg"
              # Show full error body for diagnosis
              try {
                $errDetail = $_.ErrorDetails.Message | ConvertFrom-Json
                Write-Warning "  Error code   : $($errDetail.error.code)"
                Write-Warning "  Error message: $($errDetail.error.message)"
                Write-Warning "  Error target : $($errDetail.error.target)"
              } catch { }

              if ($errMsg -like "*BadRequest*") {
                Write-Warning "  BadRequest — most likely cause: admin consent for"
                Write-Warning "  UserAuthenticationMethod.ReadWrite.All has not yet propagated."
                Write-Warning "  Wait 5 minutes and re-run, or check the App Registration"
                Write-Warning "  API permissions page and confirm admin consent is granted."
              }
              if ($errMsg -like "*Forbidden*") {
                Write-Warning "  Forbidden — UserAuthenticationMethod.ReadWrite.All is missing or"
                Write-Warning "  admin consent was not granted. Go to Entra admin center >"
                Write-Warning "  App registrations > your app > API permissions > Grant admin consent."
              }
            }

            # ── Issue TAP ────────────────────────────────────────────────────────
            # Remove any existing TAPs first (only one can be active at a time)
            Write-Host "  Checking for existing TAPs..." -ForegroundColor Cyan
            try {
              $existing = Invoke-MgGraphRequest -Method GET -Uri $TapUri
              foreach ($tap in $existing.value) {
                Invoke-MgGraphRequest -Method DELETE -Uri "$TapUri/$($tap.id)" -ErrorAction SilentlyContinue
                Write-Host "  Removed existing TAP: $($tap.id)" -ForegroundColor DarkGray
              }
            } catch { }

            Write-Host "  Issuing new TAP (60 min, one-use)..." -ForegroundColor Cyan
            try {
              $tap     = Invoke-MgGraphRequest `
                             -Method POST `
                             -Uri $TapUri `
                             -ContentType "application/json" `
                             -Body (@{ isUsableOnce = $true; lifetimeInMinutes = 60 } | ConvertTo-Json -Depth 3)
              $TapCode = $tap.temporaryAccessPass
              Write-Host "  [OK] TAP issued: $TapCode" -ForegroundColor Magenta
              Write-Host "       User must sign in with this code and register MFA within 60 minutes." -ForegroundColor Magenta
            }
            catch {
              Write-Warning "  TAP failed: $($_.Exception.Message)"
              try {
                $tapErr = $_.ErrorDetails.Message | ConvertFrom-Json
                Write-Warning "  TAP error code: $($tapErr.error.code)"
                Write-Warning "  TAP error msg : $($tapErr.error.message)"
              } catch { }
            }

            # ── Final state verification ─────────────────────────────────────────
            Write-Host "  Verifying final MFA state..." -ForegroundColor Cyan
            try {
              $final      = Invoke-MgGraphRequest -Method GET -Uri $ReqUri
              $finalState = $final.perUserMfaState
              Write-Host "  Final perUserMfaState: '$finalState'" -ForegroundColor $(if ($finalState -eq "enforced") {"Green"} else {"Red"})
            } catch {
              $finalState = "Could not read: $($_.Exception.Message)"
              Write-Warning "  $finalState"
            }

            $Results += [PSCustomObject]@{
              UPN      = $UPN
              Display  = $User.DisplayName
              MfaState = $finalState
              TAP      = if ($TapCode) { $TapCode } else { "Failed — check warnings above" }
              Status   = if ($MfaOk -and $TapCode) { "Complete" } `
                         elseif ($MfaOk) { "MFA set — TAP failed" } `
                         else { "MFA FAILED — check warnings" }
            }
          }

          # ── Summary ──────────────────────────────────────────────────────────
          Write-Host ""
          Write-Host ("=" * 60) -ForegroundColor Yellow
          Write-Host "  SUMMARY" -ForegroundColor Yellow
          Write-Host ("=" * 60) -ForegroundColor Yellow
          $Results | Format-Table UPN, MfaState, TAP, Status -AutoSize

          # ── Confirm where to check in the portal ─────────────────────────────
          Write-Host ""
          Write-Host "  To verify in the Entra portal:" -ForegroundColor Cyan
          Write-Host "  Entra admin center > Users > [user] >" -ForegroundColor Cyan
          Write-Host "  Authentication methods" -ForegroundColor Cyan
          Write-Host "  -- OR --" -ForegroundColor Cyan
          Write-Host "  Protection > Multifactor authentication > Per-user MFA" -ForegroundColor Cyan
          Write-Host "  The state should show as 'Enforced' (not Enabled or Disabled)." -ForegroundColor Cyan

          Disconnect-MgGraph | Out-Null
          Write-Host "Disconnected." -ForegroundColor Cyan
